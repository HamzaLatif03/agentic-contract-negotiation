[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-negotiation"
version = "0.1.0"
description = "Agentic contract negotiation system for loans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat>=0.4.0",
    "autogen-ext[ollama]>=0.4.0",
    "certifi>=2024.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "typing-extensions>=4.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "openai>=1.0",
    "autogen-ext[openai]>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
loan-negotiate = "loan_negotiation.cli.main:app"
loan-negotiate-api = "loan_negotiation.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
